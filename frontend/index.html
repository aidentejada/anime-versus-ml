<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アニメ VERSUS — ML Death Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #16121f;
    --bg2: #1e1830;
    --paper: #f1e6cc;
    --ink: #241c14;
    --red: #e13d4e;
    --red-dk: #8f1d2c;
    --blue: #3d7be1;
    --blue-dk: #1d3f8f;
    --gold: #ffd166;
    --white: #efe9dc;
    --grey: #8b8398;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background-color: var(--bg);
    /* seigaiha-ish wave pattern */
    background-image:
      radial-gradient(circle at 50% 110%, transparent 42%, rgba(255,255,255,0.025) 43%, rgba(255,255,255,0.025) 47%, transparent 48%),
      radial-gradient(circle at 0% 110%, transparent 42%, rgba(255,255,255,0.025) 43%, rgba(255,255,255,0.025) 47%, transparent 48%),
      radial-gradient(circle at 100% 110%, transparent 42%, rgba(255,255,255,0.025) 43%, rgba(255,255,255,0.025) 47%, transparent 48%);
    background-size: 64px 32px;
    color: var(--white);
    font-family: 'DotGothic16', monospace;
    overflow-x: hidden;
  }

  /* CRT scanlines over everything */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0px, rgba(0,0,0,0.16) 1px, transparent 1px, transparent 3px);
    z-index: 9999;
  }

  img { image-rendering: pixelated; }

  /* ============ HEADER ============ */
  header {
    text-align: center;
    padding: 22px 10px 14px;
    border-bottom: 4px solid var(--gold);
    background: linear-gradient(180deg, #241c3a 0%, var(--bg) 100%);
    position: relative;
  }
  header .sun {
    position: absolute;
    left: 50%; top: 8px;
    transform: translateX(-50%);
    width: 74px; height: 74px;
    background: radial-gradient(circle, #c2273a 0%, #c2273a 60%, transparent 61%);
    opacity: .35;
    z-index: 0;
  }
  header h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: 22px;
    color: var(--gold);
    text-shadow: 3px 3px 0 var(--red-dk), 6px 6px 0 #000;
    position: relative; z-index: 1;
    letter-spacing: 2px;
  }
  header .jp {
    font-size: 15px;
    color: var(--grey);
    margin-top: 8px;
    letter-spacing: 8px;
    position: relative; z-index: 1;
  }

  #ghCorner {
    position: absolute;
    top: 14px; right: 16px;
    z-index: 10;
    text-align: right;
  }
  #ghCorner a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--white);
    text-decoration: none;
    background: #2a2438;
    border: 3px solid var(--gold);
    box-shadow: 0 0 0 2px #000, 3px 3px 0 2px rgba(0,0,0,.6);
    padding: 7px 10px;
    letter-spacing: 1px;
  }
  #ghCorner a:hover { background: #3a3050; transform: translateY(-1px); }
  #ghCorner a:active { transform: translateY(2px); box-shadow: 0 0 0 2px #000; }
  #ghCorner a svg { width: 16px; height: 16px; fill: var(--gold); image-rendering: pixelated; }
  #ghCorner .by {
    display: block;
    margin-top: 6px;
    font-family: 'DotGothic16', monospace;
    font-size: 12px;
    color: var(--grey);
    letter-spacing: 1px;
  }

  @media (max-width: 760px) {
    #ghCorner { position: static; text-align: center; margin-top: 10px; }
  }

  /* ============ ARENA SPLIT ============ */
  #arena {
    display: flex;
    min-height: calc(100vh - 118px);
    position: relative;
  }

  .side {
    flex: 1;
    padding: 18px 16px 90px;
    min-width: 0;
  }
  #sideA { border-right: 2px solid #000; background: linear-gradient(180deg, rgba(225,61,78,0.07), transparent 240px); }
  #sideB { border-left: 2px solid #000; background: linear-gradient(180deg, rgba(61,123,225,0.07), transparent 240px); }

  .side h2 {
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    text-align: center;
    padding: 10px 6px;
    margin-bottom: 14px;
    border: 3px solid;
    box-shadow: 0 0 0 3px #000, inset 0 0 0 2px #000;
  }
  #sideA h2 { color: #ff97a1; border-color: var(--red); background: rgba(143,29,44,.35); }
  #sideB h2 { color: #9dc0ff; border-color: var(--blue); background: rgba(29,63,143,.35); }
  .side h2 .jp { display:block; font-family:'DotGothic16'; font-size: 12px; margin-top:6px; color: var(--grey); }

  /* center VS divider */
  #vsBadge {
    position: absolute;
    left: 50%; top: 170px;
    transform: translateX(-50%);
    z-index: 5;
    font-family: 'Press Start 2P', monospace;
    font-size: 26px;
    color: var(--gold);
    background: var(--bg2);
    border: 4px solid var(--gold);
    box-shadow: 0 0 0 4px #000, 6px 6px 0 4px rgba(0,0,0,.6);
    padding: 16px 14px;
    text-shadow: 2px 2px 0 var(--red-dk);
    pointer-events: none;
  }

  /* ============ ROSTER GRID ============ */
  .roster {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 12px;
  }

  .card {
    position: relative;
    cursor: pointer;
    background: var(--bg2);
    border: 3px solid #4a4258;
    box-shadow: 0 0 0 2px #000;
    transition: transform .08s steps(2), border-color .08s;
  }
  .card:hover { transform: translateY(-3px); z-index: 20; }
  #sideA .card:hover { border-color: var(--red); }
  #sideB .card:hover { border-color: var(--blue); }

  .card img {
    display: block;
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    filter: contrast(1.05) saturate(1.1);
  }
  .card .nm {
    display: block;
    font-size: 11px;
    text-align: center;
    padding: 4px 2px 5px;
    background: #000;
    color: var(--white);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* hover tooltip — abridged info card (appears after delay) */
  .tip {
    position: absolute;
    left: 50%; top: -8px;
    transform: translate(-50%, -100%);
    width: 195px;
    background: var(--paper);
    color: var(--ink);
    border: 3px solid var(--ink);
    box-shadow: 4px 4px 0 rgba(0,0,0,.7);
    padding: 8px 9px;
    font-size: 12px;
    line-height: 1.45;
    opacity: 0;
    visibility: hidden;
    transition: opacity .12s, visibility .12s;
    transition-delay: 0s;
    pointer-events: none;
    z-index: 50;
  }
  .card:hover .tip {
    opacity: 1;
    visibility: visible;
    transition-delay: .55s;   /* hover a moment before it shows */
  }
  .tip b { font-size: 12px; display:block; border-bottom: 2px solid var(--ink); padding-bottom:3px; margin-bottom:4px; }
  .tip .frm { color: #6b4b2a; font-size: 11px; display:block; margin-bottom:4px; }
  .tip .st { display:flex; justify-content: space-between; gap:6px; }
  .tip .st span:last-child { font-weight: bold; }

  /* ============ PROFILE (selected) ============ */
  .profile {
    display: none;
    max-width: 420px;
    margin: 0 auto;
    animation: pop .18s steps(3);
  }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .profile .frame {
    border: 4px solid var(--gold);
    box-shadow: 0 0 0 4px #000, 8px 8px 0 4px rgba(0,0,0,.55);
    background: var(--bg2);
    padding: 12px;
  }
  #sideA .profile .frame { border-color: var(--red); }
  #sideB .profile .frame { border-color: var(--blue); }

  .profile img.big {
    display:block;
    width: 100%;
    max-height: 300px;
    object-fit: contain;
    background:
      repeating-conic-gradient(rgba(255,255,255,.04) 0% 25%, transparent 0% 50%) 0 0 / 16px 16px,
      #120e1c;
    border: 3px solid #000;
  }
  .profile h3 {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: var(--gold);
    margin: 12px 0 4px;
    text-shadow: 2px 2px 0 #000;
  }
  .profile .sub { color: var(--grey); font-size: 13px; margin-bottom: 10px; }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3px 14px;
    font-size: 12.5px;
    background: rgba(0,0,0,.35);
    border: 2px solid #000;
    padding: 8px 10px;
  }
  .stats .row { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted #3c3450; padding: 2px 0; }
  .stats .row .k { color: var(--grey); }
  .stats .row .v { color: var(--white); text-align: right; }
  .stats .row .v small { color: var(--gold); }

  .profile .notes {
    margin-top: 10px;
    background: var(--paper);
    color: var(--ink);
    border: 3px solid var(--ink);
    box-shadow: 3px 3px 0 rgba(0,0,0,.6);
    padding: 8px 10px;
    font-size: 12.5px;
    line-height: 1.5;
  }
  .profile .notes b { display:block; margin-bottom: 2px; font-size: 11px; letter-spacing: 1px; }

  /* ============ CUSTOM FIGHTER ============ */
  .qtile {
    aspect-ratio: 3 / 4;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      repeating-conic-gradient(rgba(255,255,255,.05) 0% 25%, transparent 0% 50%) 0 0 / 16px 16px,
      #241d33;
  }
  .qtile .plus {
    font-family: 'Press Start 2P', monospace;
    font-size: 40px;
    color: var(--gold);
    text-shadow: 3px 3px 0 #000;
  }
  .card:hover .qtile .plus { color: #ffe08f; }
  .big.qm {
    position: relative;
    width: 100%;
    height: 260px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    overflow: hidden;
    background:
      repeating-conic-gradient(rgba(255,255,255,.04) 0% 25%, transparent 0% 50%) 0 0 / 16px 16px,
      #241d33;
    border: 3px solid #000;
  }
  .big.qm svg.sil { width: 72%; height: 90%; fill: #000; }

  .builder { display: none; max-width: 470px; margin: 0 auto; animation: pop .18s steps(3); }
  .builder .frame {
    border: 4px solid var(--gold);
    box-shadow: 0 0 0 4px #000, 8px 8px 0 4px rgba(0,0,0,.55);
    background: var(--bg2);
    padding: 14px;
  }
  #sideA .builder .frame { border-color: var(--red); }
  #sideB .builder .frame { border-color: var(--blue); }
  .builder h3 {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    color: var(--gold);
    text-shadow: 2px 2px 0 #000;
    margin-bottom: 10px;
  }
  .builder .guide {
    background: var(--paper);
    color: var(--ink);
    border: 3px solid var(--ink);
    box-shadow: 3px 3px 0 rgba(0,0,0,.6);
    padding: 8px 10px;
    font-size: 12.5px;
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .builder .guide b { display: block; font-size: 11px; letter-spacing: 1px; margin-bottom: 3px; }
  .builder .guide a { color: var(--red-dk); font-weight: bold; }
  .builder label {
    display: block;
    font-size: 12px;
    color: var(--grey);
    margin: 8px 0 3px;
    letter-spacing: 1px;
  }
  .builder input[type="text"], .builder select, .builder textarea, .builder input[type="number"] {
    width: 100%;
    background: #141020;
    color: var(--white);
    border: 2px solid #4a4258;
    padding: 6px 8px;
    font-family: 'DotGothic16', monospace;
    font-size: 13px;
  }
  .builder input:focus, .builder select:focus, .builder textarea:focus { outline: 2px solid var(--gold); }
  .builder .statGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .builder .haxGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .builder textarea { resize: vertical; min-height: 56px; }
  .builder .secHead {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--gold);
    margin: 14px 0 2px;
    letter-spacing: 1px;
    border-bottom: 2px solid #38304a;
    padding-bottom: 4px;
  }
  .aiBtn {
    display: block;
    width: 100%;
    margin-top: 10px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    padding: 10px;
    cursor: pointer;
    color: var(--ink);
    background: var(--gold);
    border: 3px solid #a8842f;
    box-shadow: 0 3px 0 #000;
  }
  .aiBtn:hover { background: #ffe08f; }
  .aiBtn:active { transform: translateY(2px); box-shadow: none; }
  .aiBtn:disabled { background: #6a6180; color: #2a2438; cursor: not-allowed; }
  .builder .msg { font-size: 12px; color: #ff97a1; min-height: 15px; margin-top: 5px; }
  .confirmBtn {
    display: block;
    width: 100%;
    margin-top: 12px;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    padding: 12px;
    cursor: pointer;
    color: #fff;
    background: linear-gradient(180deg, var(--red) 0%, var(--red-dk) 100%);
    border: 3px solid var(--gold);
    box-shadow: 0 3px 0 #000;
  }
  #sideB .confirmBtn { background: linear-gradient(180deg, var(--blue) 0%, var(--blue-dk) 100%); }
  .confirmBtn:active { transform: translateY(2px); box-shadow: none; }

  .backBtn {
    display: block;
    width: 100%;
    margin-top: 12px;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    padding: 10px;
    cursor: pointer;
    color: var(--white);
    background: #3a3348;
    border: 3px solid #6a6180;
    box-shadow: 0 3px 0 #000;
  }
  .backBtn:hover { background: #4a4160; }
  .backBtn:active { transform: translateY(2px); box-shadow: none; }

  /* ============ FIGHT BUTTON ============ */
  #fightBar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    text-align: center;
    padding: 12px;
    background: linear-gradient(0deg, rgba(0,0,0,.92), rgba(0,0,0,.6) 80%, transparent);
    z-index: 100;
  }
  #fightBtn {
    font-family: 'Press Start 2P', monospace;
    font-size: 16px;
    padding: 14px 44px;
    cursor: pointer;
    color: #5a5468;
    background: #2a2438;
    border: 4px solid #453d58;
    box-shadow: 0 0 0 3px #000;
    letter-spacing: 3px;
  }
  #fightBtn.ready {
    color: #fff;
    background: linear-gradient(180deg, var(--red) 0%, var(--red-dk) 100%);
    border-color: var(--gold);
    animation: throb 0.8s steps(2) infinite;
  }
  @keyframes throb { 50% { box-shadow: 0 0 0 3px #000, 0 0 18px var(--red); } }
  #fightBtn.ready:active { transform: translateY(3px); }

  /* ============ BATTLE OVERLAY ============ */
  #battle {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 500;
    background: rgba(10,7,16,.96);
    overflow-y: auto;
    padding: 28px 14px 40px;
  }
  #battle.on { display: block; }

  #battle .inner { max-width: 760px; margin: 0 auto; }

  #battleTitle {
    font-family: 'Press Start 2P', monospace;
    text-align: center;
    font-size: 13px;
    color: var(--gold);
    margin-bottom: 4px;
  }
  #battleTitle .jp { font-family:'DotGothic16'; display:block; color: var(--grey); font-size: 13px; margin-top: 5px; letter-spacing: 5px;}

  /* pixel fight stage */
  #stage {
    position: relative;
    height: 150px;
    margin: 16px 0;
    border: 4px solid #000;
    box-shadow: 0 0 0 3px #38304a;
    background:
      linear-gradient(180deg, #2b1f45 0%, #452a4e 55%, #1c1428 56%, #14101e 100%);
    overflow: hidden;
  }
  #stage.shake { animation: shake .28s steps(4) infinite; }
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    25% { transform: translate(-3px,2px); }
    50% { transform: translate(3px,-2px); }
    75% { transform: translate(-2px,-2px); }
  }
  #stage .moon {
    position: absolute; right: 40px; top: 14px;
    width: 34px; height: 34px;
    background: radial-gradient(circle, #ffd166 0 58%, transparent 60%);
    opacity: .8;
  }
  #fightCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    z-index: 2;
  }
  #stage .simText {
    position: absolute;
    top: 8px; left: 10px;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--gold);
    letter-spacing: 1px;
    animation: blink 1s steps(1) infinite;
    z-index: 3;
  }
  #stage .ground {
    position:absolute; bottom:0; left:0; right:0; height: 22px;
    background: repeating-linear-gradient(90deg, #241a35 0 14px, #1d1530 14px 28px);
    border-top: 3px solid #000;
  }

  /* JRPG dialogue box for the stream */
  #streamBox {
    background: var(--paper);
    color: var(--ink);
    border: 4px solid var(--ink);
    box-shadow: 0 0 0 3px var(--paper), 6px 6px 0 3px rgba(0,0,0,.65);
    padding: 14px 16px 18px;
    font-size: 15.5px;
    line-height: 1.65;
    min-height: 90px;
    white-space: pre-wrap;
  }
  #streamBox .tag {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: var(--red-dk);
    display: block;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  #streamText::after {
    content: "▌";
    animation: blink .7s steps(1) infinite;
    color: var(--red-dk);
  }
  #streamBox.done #streamText::after { content: ""; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ============ RESULTS ============ */
  #results { display: none; margin-top: 22px; animation: pop .25s steps(4); }
  #results.on { display: block; }

  #winnerBanner {
    text-align: center;
    font-family: 'Press Start 2P', monospace;
    font-size: 17px;
    color: var(--gold);
    background: linear-gradient(180deg, #3a2b12, #241a0a);
    border: 4px solid var(--gold);
    box-shadow: 0 0 0 3px #000, 0 0 26px rgba(255,209,102,.25);
    padding: 16px 10px;
    text-shadow: 2px 2px 0 var(--red-dk);
  }
  #winnerBanner .jp { display:block; font-family:'DotGothic16'; font-size:14px; color:var(--grey); margin-top:8px; letter-spacing:6px; }

  .probRow { margin-top: 14px; }
  .probRow .lbl { display:flex; justify-content:space-between; font-size: 13px; margin-bottom: 3px; }
  .bar {
    height: 18px;
    background: #241d33;
    border: 2px solid #000;
    box-shadow: 0 0 0 2px #38304a;
    position: relative;
    overflow: hidden;
  }
  .bar .fill {
    height: 100%;
    width: 0%;
    transition: width 1s steps(12);
    background: repeating-linear-gradient(90deg, var(--red) 0 10px, #ff6b7a 10px 12px);
  }
  .bar .fill.b { background: repeating-linear-gradient(90deg, var(--blue) 0 10px, #6b9dff 10px 12px); }

  #factors {
    margin-top: 16px;
    background: rgba(0,0,0,.4);
    border: 3px solid #38304a;
    box-shadow: 0 0 0 2px #000;
    padding: 10px 14px;
    font-size: 13.5px;
  }
  #factors h4 {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: var(--gold);
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  #factors .f { display:flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-bottom: 1px dotted #38304a; }
  #factors .f .val.pos { color: #ff97a1; }
  #factors .f .val.neg { color: #9dc0ff; }

  #rematch {
    display:block;
    margin: 22px auto 0;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    padding: 12px 30px;
    cursor: pointer;
    color: var(--white);
    background: #3a3348;
    border: 3px solid var(--gold);
    box-shadow: 0 4px 0 #000;
  }
  #rematch:hover { background: #4a4160; }
  #rematch:active { transform: translateY(3px); box-shadow: none; }

  @media (max-width: 760px) {
    #arena { flex-direction: column; }
    #vsBadge { display: none; }
    header h1 { font-size: 15px; }
  }
</style>
</head>
<body>

<header>
  <div class="sun"></div>
  <h1>ANIME VERSUS</h1>
  <div class="jp">アニメ対戦 — 機械学習デスバトル</div>
  <div id="ghCorner">
    <a href="https://github.com/aidentejada/anime-versus-ml" target="_blank" rel="noopener">

<script>
/* ---------------- stat word-form mappings ---------------- */
const AP_COLS = ["tier","attack","durability","striking_strength"];
const HAX_COLS = ["durability_negation","regeneration","power_amplification","mobility_hax",
                  "time_space_manip","mind_soul_hax","resistance_physical","resistance_hax"];

/* word-tier <-> numeric value, straight from POWER_SCALE.md (log10 midpoints).
   ONE source of truth: the builder dropdowns AND the stat display both read these. */
const AP_TIERS = [
  ["Below Average Human",0.89],["Human level",1.90],["Athlete level",2.25],["Street level",3.33],
  ["Wall level",5.75],["Small Building level",8.17],["Building level",9.47],["Large Building level",10.29],
  ["City Block level",11.14],["Multi-City Block level",12.12],["Small Town level",13.00],["Town level",14.00],
  ["Large Town level",15.12],["Small City level",16.02],["City level",17.02],["Mountain level",18.12],
  ["Large Mountain level",18.94],["Island level",19.94],["Large Island level",21.12],["Small Country level",22.04],
  ["Country level",23.04],["Large Country level",24.06],["Continent level",24.89],["Multi-Continent level",27.18],
  ["Moon level",29.68],["Small Planet level",31.33],["Planet level",33.30],["Large Planet level",36.02],
  ["Brown Dwarf level",39.17],["Small Star level",41.13],["Star level",42.13],["Large Star level",43.98],
  ["Solar System level",51.38],["Multi-Solar System level",61.66],["Galaxy level",67.48],["Multi-Galaxy level",80.69],
  ["Universe level",93.95],["High Universe level",94.50],["Universe level+",95.45],["Low Multiverse level",96.00],
  ["Multiverse level",96.50],["Multiverse level+",97.00],["Low Complex Multiverse level",97.50],
  ["Complex Multiverse level",98.00],["High Complex Multiverse level",98.25],["Hyperverse level",98.50],
  ["High Hyperverse level",98.75],["Low Outerverse level",99.00],["Outerverse level",99.25],
  ["Outerverse level+",99.50],["High Outerverse level",99.75],["Infinite / Immeasurable",100.00]
];
const SPEED_TIERS = [
  ["Immobile",0.00],["Below Average Human",0.35],["Average Human",0.79],["Athletic Human",0.89],
  ["Peak Human",1.04],["Superhuman",1.33],["Subsonic",1.87],["Subsonic+",2.37],["Transonic",2.55],
  ["Supersonic",2.76],["Supersonic+",3.07],["Hypersonic",3.37],["Hypersonic+",3.67],["High Hypersonic",4.07],
  ["High Hypersonic+",4.37],["Massively Hypersonic",4.87],["Massively Hypersonic+",5.51],
  ["Sub-Relativistic",7.33],["Sub-Relativistic+",7.52],["Relativistic",7.85],["Relativistic+",8.33],
  ["Speed of Light",8.48],["FTL",8.93],["FTL+",9.93],["Massively FTL",10.93],["Massively FTL+",11.48],
  ["Infinite / Immeasurable / Omnipresent",100.00]
];
const LIFT_TIERS = [
  ["Below Average Human",0.85],["Average Human",1.80],["Above Average Human",1.99],["Athletic Human",2.22],
  ["Peak Human",2.55],["Superhuman / Class 1",2.87],["Class 5",3.35],["Class 10",3.85],["Class 25",4.20],
  ["Class 50",4.55],["Class 100",4.85],["Class K",5.35],["Class M",7.50],["Class G",10.50],["Class T",13.50],
  ["Class P",16.50],["Class E",19.50],["Class Z",22.50],["Class Y",25.50],["Pre-Stellar",28.15],
  ["Stellar",31.05],["Multi-Stellar",37.30],["Galactic",42.99],["Multi-Galactic",48.48],["Universal",53.18],
  ["Infinite / Immeasurable",100.00]
];
const INT_TIERS = [
  ["Mindless",1],["Instinctive",2],["Animalistic",3],["High Animalistic",4],["Below Average",5],
  ["Average",6],["Above Average",7],["Gifted",8],["Genius",9],["Extraordinary Genius",10],
  ["Supergenius",11],["Nigh-Omniscient",12],["Omniscient",100]
];
const STAM_TIERS = [
  ["Below Average",1],["Average",2],["Athletic",3],["Peak Human",4],["Superhuman",5],["Infinite",100]
];

// map a stored number back to its wiki word by nearest rubric value
function nearestTier(tiers, v){
  let best = tiers[0][0], bd = Infinity;
  for (const [w, val] of tiers){
    const d = Math.abs(val - v);
    if (d < bd){ bd = d; best = w; }
  }
  return best;
}
function apWord(v){ return nearestTier(AP_TIERS, v); }
function speedWord(v){ return nearestTier(SPEED_TIERS, v); }
function intWord(v){ return nearestTier(INT_TIERS, v); }
function stamWord(v){ return nearestTier(STAM_TIERS, v); }
function liftWord(v){ return nearestTier(LIFT_TIERS, v); }
function haxWord(v){
  if (v < 1.5) return "None";
  if (v < 3) return "Minimal";
  if (v < 4.5) return "Low";
  if (v < 6) return "Moderate";
  if (v < 7.5) return "High";
  if (v < 8.75) return "Extreme";
  return "Godly";
}
function statWord(col, v){
  if (AP_COLS.includes(col)) return apWord(v);
  if (col === "speed") return speedWord(v);
  if (col === "intelligence") return intWord(v);
  if (col === "stamina") return stamWord(v);
  if (col === "lifting_strength") return liftWord(v);
  if (HAX_COLS.includes(col)) return haxWord(v);
  return String(v);
}
const STAT_ORDER = ["tier","attack","speed","durability","intelligence","stamina",
  "lifting_strength","striking_strength","durability_negation","regeneration",
  "power_amplification","mobility_hax","time_space_manip","mind_soul_hax",
  "resistance_physical","resistance_hax"];
const pretty = c => c.replaceAll("_"," ").replace(/\b\w/g, s => s.toUpperCase());

/* blacked-out bust for custom fighters (no portrait) */
const SILHOUETTE = `<svg class="sil" viewBox="0 0 100 100" preserveAspectRatio="xMidYMax meet"><circle cx="50" cy="33" r="19"/><path d="M14 100 C14 67 31 55 50 55 C69 55 86 67 86 100 Z"/></svg>`;

/* ---------------- state ---------------- */
let CHARS = [];
let sel = { A: null, B: null };

/* ---------------- load roster ---------------- */
async function init(){
  const res = await fetch("/chars");
  CHARS = await res.json();
  CHARS.sort((a,b) => a.name.localeCompare(b.name));   // alphabetical
  renderRoster("A");
  renderRoster("B");
}

function cardHTML(c){
  return `
    <img src="/imgs/${c.image_links}" alt="${c.name}" loading="lazy">
    <span class="nm">${c.name}</span>
    <div class="tip">
      <b>${c.name}</b>
      <span class="frm">${c["form / era / buff"]} — ${c.anime}</span>
      <div class="st"><span>Tier</span><span>${apWord(c.tier)} (${c.tier})</span></div>
      <div class="st"><span>Attack</span><span>${apWord(c.attack)} (${c.attack})</span></div>
      <div class="st"><span>Speed</span><span>${speedWord(c.speed)} (${c.speed})</span></div>
    </div>`;
}

function renderRoster(side){
  const el = document.getElementById("roster"+side);
  el.innerHTML = "";
  CHARS.forEach(c => {
    const d = document.createElement("div");
    d.className = "card";
    d.innerHTML = cardHTML(c);
    d.onclick = () => select(side, c);
    d.addEventListener("mouseenter", () => {
      const tip = d.querySelector(".tip");
      if (!tip) return;
      tip.style.marginLeft = "0px";
      tip.style.top = "";
      tip.style.transform = "";
      const tr = tip.getBoundingClientRect();
      let shift = 0;
      if (tr.left < 8) shift = 8 - tr.left;
      else if (tr.right > innerWidth - 8) shift = (innerWidth - 8) - tr.right;
      tip.style.marginLeft = shift + "px";
      if (tr.top < 4) {              // would clip the top -> flip below the card
        tip.style.top = "calc(100% + 8px)";
        tip.style.transform = "translate(-50%, 0)";
      }
    });
    el.appendChild(d);
  });

  // custom fighter card at the very end of the list
  const q = document.createElement("div");
  q.className = "card";
  q.innerHTML = `<div class="qtile"><span class="plus">+</span></div><span class="nm">CREATE FIGHTER</span>`;
  q.onclick = () => openBuilder(side);
  el.appendChild(q);
}

/* ---------------- custom fighter builder ---------------- */
/* (tier tables live up top, shared with the stat-display functions) */

function tierOptions(tiers, def){
  return tiers.map(([w, v]) =>
    `<option value="${v}" ${w === def ? "selected" : ""}>${w} (${v})</option>`).join("");
}

function tierSelect(cls, label, tiers, def){
  return `<div><label>${label}</label><select class="${cls}">${tierOptions(tiers, def)}</select></div>`;
}

function openBuilder(side){
  document.getElementById("roster" + side).style.display = "none";
  const b = document.getElementById("builder" + side);

  const haxInputs = HAX_COLS.map(k => `
    <div><label>${pretty(k)}</label>
    <input type="number" class="hax-${k}" min="1" max="10" step="0.5" value="1.0"></div>`).join("");

  b.innerHTML = `
    <div class="frame">
      <h3>CREATE FIGHTER 作成</h3>

      <div class="guide">
        <b>HOW TO SCALE YOUR FIGHTER</b>
        1. Look them up on the <a href="https://vsbattles.fandom.com/wiki/VS_Battles_Wiki" target="_blank" rel="noopener">VS Battles Wiki</a>.<br>
        2. Their profile lists the exact wording used below — Attack Potency, Speed, Durability, Striking / Lifting Strength, Intelligence, Stamina.<br>
        3. Pick the matching tier from each dropdown (converted to the model's numeric scale automatically).<br>
        4. Hit AUTOFILL and an AI scores the eight ability stats from the name + form — tweak them if you disagree.
      </div>

      <label>NAME</label><input type="text" class="f-name" placeholder="e.g. Saitama" maxlength="40">
      <label>FORM / ERA / BUFF</label><input type="text" class="f-form" placeholder="e.g. Serious Punch" maxlength="40">
      <label>ANIME / SERIES</label><input type="text" class="f-anime" placeholder="e.g. One Punch Man" maxlength="40">

      <div class="secHead">PHYSICAL STATS (from the wiki)</div>
      <div class="statGrid">
        ${tierSelect("f-tier", "Tier / AP", AP_TIERS, "City level")}
        ${tierSelect("f-attack", "Attack", AP_TIERS, "City level")}
        ${tierSelect("f-durability", "Durability", AP_TIERS, "City level")}
        ${tierSelect("f-striking_strength", "Striking Strength", AP_TIERS, "City level")}
        ${tierSelect("f-speed", "Speed", SPEED_TIERS, "Supersonic")}
        ${tierSelect("f-lifting_strength", "Lifting Strength", LIFT_TIERS, "Class 5")}
        ${tierSelect("f-intelligence", "Intelligence", INT_TIERS, "Average")}
        ${tierSelect("f-stamina", "Stamina", STAM_TIERS, "Superhuman")}
      </div>

      <div class="secHead">ABILITIES / HAX (1-10)</div>
      <div class="haxGrid">${haxInputs}</div>
      <button class="aiBtn" disabled>◆ AUTOFILL ABILITIES (AI)</button>
      <div class="msg">Enter a name, form + anime to enable AI autofill.</div>

      <label>CANON MECHANICS NOTE (optional — grounds the fight narration)</label>
      <textarea class="f-notes" maxlength="400" placeholder="How do they actually win/lose? e.g. 'One punch ends anything physical, but he has no answer to soul or spatial hax.'"></textarea>

      <button class="confirmBtn">CONFIRM FIGHTER ⮕</button>
      <button class="backBtn">◀ BACK 戻る</button>
    </div>`;

  const msg = b.querySelector(".msg");
  const nameIn = b.querySelector(".f-name");
  const formIn = b.querySelector(".f-form");
  const animeIn = b.querySelector(".f-anime");
  const aiBtn = b.querySelector(".aiBtn");

  // AI autofill needs name + form + anime -- the series disambiguates odd/shared names
  const refreshAi = () => {
    const ready = nameIn.value.trim() && formIn.value.trim() && animeIn.value.trim();
    aiBtn.disabled = !ready;
    if (ready && msg.textContent.startsWith("Enter a name")) msg.textContent = "";
  };
  nameIn.addEventListener("input", refreshAi);
  formIn.addEventListener("input", refreshAi);
  animeIn.addEventListener("input", refreshAi);

  aiBtn.onclick = async () => {
    aiBtn.disabled = true; aiBtn.textContent = "SCORING..."; msg.textContent = "";
    try {
      const r = await fetch("/score_abilities", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: nameIn.value.trim(),
          form: formIn.value.trim(),
          anime: b.querySelector(".f-anime").value.trim()
        })
      });
      const d = await r.json();
      HAX_COLS.forEach(k => { b.querySelector(".hax-" + k).value = d.scores[k]; });
      if (!d.ok) msg.textContent = "AI scoring failed — floors set, adjust manually. (" + d.error + ")";
    } catch(e){
      msg.textContent = "Request failed: " + e;
    }
    aiBtn.textContent = "◆ AUTOFILL ABILITIES (AI)";
    refreshAi();
  };

  b.querySelector(".confirmBtn").onclick = () => {
    const gv = cls => parseFloat(b.querySelector("." + cls).value);
    const fighter = {
      name: b.querySelector(".f-name").value.trim() || "Custom Fighter",
      "form / era / buff": b.querySelector(".f-form").value.trim() || "Custom",
      anime: b.querySelector(".f-anime").value.trim() || "Original",
      image_links: null,
      custom: true,
      notes: b.querySelector(".f-notes").value.trim() ||
        "Custom fighter with no canon brief — judge strictly from the statistical profile provided.",
      tier: gv("f-tier"), attack: gv("f-attack"), speed: gv("f-speed"),
      durability: gv("f-durability"), intelligence: gv("f-intelligence"), stamina: gv("f-stamina"),
      lifting_strength: gv("f-lifting_strength"), striking_strength: gv("f-striking_strength"),
      ...Object.fromEntries(HAX_COLS.map(k => {
        let v = parseFloat(b.querySelector(".hax-" + k).value);
        if (isNaN(v)) v = 1.0;
        return [k, Math.min(10, Math.max(1, v))];
      }))
    };
    b.style.display = "none";
    select(side, fighter);
  };

  b.querySelector(".backBtn").onclick = () => {
    b.style.display = "none";
    document.getElementById("roster" + side).style.display = "grid";
  };

  b.style.display = "block";
}

/* ---------------- selection / profile ---------------- */
function select(side, c){
  sel[side] = c;
  document.getElementById("roster"+side).style.display = "none";
  document.getElementById("builder"+side).style.display = "none";
  const p = document.getElementById("profile"+side);
  const rows = STAT_ORDER.map(col => `
      <div class="row"><span class="k">${pretty(col)}</span>
      <span class="v">${statWord(col, c[col])} <small>(${c[col]})</small></span></div>`).join("");
  const portrait = c.image_links
    ? `<img class="big" src="/imgs/${c.image_links}" alt="${c.name}">`
    : `<div class="big qm">${SILHOUETTE}</div>`;
  p.innerHTML = `
    <div class="frame">
      ${portrait}
      <h3>${c.name}</h3>
      <div class="sub">${c["form / era / buff"]} ・ ${c.anime}</div>
      <div class="stats">${rows}</div>
      <div class="notes"><b>◆ CANON MECHANICS 奥義</b>${c.notes}</div>
      <button class="backBtn">◀ BACK 戻る</button>
    </div>`;
  p.querySelector(".backBtn").onclick = () => deselect(side);
  p.style.display = "block";
  updateFightBtn();
}

function deselect(side){
  sel[side] = null;
  document.getElementById("profile"+side).style.display = "none";
  document.getElementById("builder"+side).style.display = "none";
  document.getElementById("roster"+side).style.display = "grid";
  updateFightBtn();
}

function updateFightBtn(){
  const btn = document.getElementById("fightBtn");
  if (sel.A && sel.B){
    btn.disabled = false;
    btn.classList.add("ready");
    btn.textContent = "⚔ FIGHT ⚔";
  } else {
    btn.disabled = true;
    btn.classList.remove("ready");
    btn.textContent = "SELECT FIGHTERS";
  }
}

/* ---------------- pixel fight engine ---------------- */
const SPRITE_IDLE = [
  "..XXX..",
  "..XWX..",
  "..XXX..",
  "...X...",
  ".XXXXX.",
  "X..X..X",
  "...X...",
  "..XXX..",
  "..X.X..",
  "..X.X..",
  "..X.X.."
];
const SPRITE_PUNCH = [
  "..XXX..",
  "..XXW..",
  "..XXX..",
  "...X...",
  ".XXXXXX",
  "X..X...",
  "...X...",
  "..XXX..",
  "..X.X..",
  ".X...X.",
  ".X...X."
];
const COL_A = "#ff5a68", COL_B = "#5a8dff";
let animId = null, animTimer = null;

function drawSprite(ctx, sprite, x, y, color, flip, px){
  const w = sprite[0].length;
  for (let r = 0; r < sprite.length; r++){
    for (let c = 0; c < w; c++){
      const ch = sprite[r][flip ? w - 1 - c : c];
      if (ch === ".") continue;
      ctx.fillStyle = ch === "W" ? "#fff" : color;
      ctx.fillRect(x + c * px, y + r * px, px, px);
    }
  }
}

function stopFightAnim(){
  cancelAnimationFrame(animId);
  clearTimeout(animTimer);
}

function startFightAnim(){
  stopFightAnim();
  const cv = document.getElementById("fightCanvas");
  const ctx = cv.getContext("2d");
  const W = cv.width = 192, H = cv.height = 80;
  const px = 2, sprW = 7 * px, sprH = 11 * px, feetY = 68;
  const aHome = 16, bHome = W - 16 - sprW;
  const aHit = W / 2 - sprW - 2, bHit = W / 2 + 2;
  let sparks = [];
  const t0 = performance.now();

  function frame(now){
    const t = (now - t0) % 1500;
    ctx.clearRect(0, 0, W, H);

    let ax = aHome, bx = bHome, pose = SPRITE_IDLE, bob = 0, clash = false;
    if (t < 550){                              // face off, bounce
      bob = Math.floor(t / 140) % 2;
    } else if (t < 850){                       // dash in (chunky steps)
      const p = Math.floor(((t - 550) / 300) * 5) / 5;
      ax = aHome + (aHit - aHome) * p;
      bx = bHome + (bHit - bHome) * p;
      pose = SPRITE_PUNCH;
    } else if (t < 1100){                      // CLASH
      ax = aHit; bx = bHit; pose = SPRITE_PUNCH; clash = true;
      if (sparks.length === 0){
        for (let i = 0; i < 12; i++){
          const ang = Math.random() * Math.PI * 2, sp = 0.6 + Math.random() * 1.5;
          sparks.push({ x: W/2, y: feetY - 14, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp - .4, life: 16 });
        }
      }
    } else {                                   // knockback
      const p = Math.floor(((t - 1100) / 400) * 5) / 5;
      ax = aHit + (aHome - aHit) * p;
      bx = bHit + (bHome - bHit) * p;
      if (t > 1480) sparks = [];
    }

    sparks.forEach(s => { s.x += s.vx; s.y += s.vy; s.life--; });
    sparks = sparks.filter(s => s.life > 0);
    sparks.forEach(s => {
      ctx.fillStyle = s.life % 2 ? "#ffd166" : "#fff";
      ctx.fillRect(s.x, s.y, 2, 2);
    });

    drawSprite(ctx, pose, ax, feetY - sprH - bob * px, COL_A, false, px);
    drawSprite(ctx, pose, bx, feetY - sprH - (bob ? 0 : 1) * px, COL_B, true, px);

    if (clash && Math.floor(t / 60) % 2 === 0){
      ctx.fillStyle = "rgba(255,255,255,.5)";     // impact flash
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#ffd166";
      ctx.font = '10px "Press Start 2P"';
      ctx.fillText("*", W/2 - 4, feetY - 26);
    }
    animId = requestAnimationFrame(frame);
  }
  animId = requestAnimationFrame(frame);
}

function endFightAnim(winnerIsA){
  stopFightAnim();
  const cv = document.getElementById("fightCanvas");
  const ctx = cv.getContext("2d");
  const W = cv.width, px = 2, sprH = 11 * px, feetY = 68;
  let tick = 0;
  function scene(){
    ctx.clearRect(0, 0, W, cv.height);
    const winCol  = winnerIsA ? COL_A : COL_B;
    const loseCol = winnerIsA ? COL_B : COL_A;
    // winner stands tall, bouncing; loser flat on the ground
    drawSprite(ctx, SPRITE_IDLE, W/2 - 26, feetY - sprH - (tick % 2) * px, winCol, !winnerIsA, px);
    ctx.save();
    ctx.translate(W/2 + 8, feetY - 4);
    ctx.rotate(Math.PI / 2);
    drawSprite(ctx, SPRITE_IDLE, 0, 0, loseCol, false, px);
    ctx.restore();
    if (tick % 2 === 0){
      ctx.fillStyle = "#ffd166";
      ctx.font = '10px "Press Start 2P"';
      ctx.fillText("K.O.!", W/2 - 22, 18);
    }
    tick++;
    animTimer = setTimeout(scene, 320);
  }
  scene();
}

/* ---------------- battle ---------------- */
document.getElementById("fightBtn").onclick = fight;
document.getElementById("rematch").onclick = () => {
  stopFightAnim();
  document.getElementById("battle").classList.remove("on");
  document.getElementById("results").classList.remove("on");
  document.getElementById("streamText").textContent = "";
  document.getElementById("streamBox").classList.remove("done");
};

async function fight(){
  const a = sel.A, b = sel.B;
  const battle = document.getElementById("battle");
  const stage = document.getElementById("stage");
  const streamText = document.getElementById("streamText");
  const streamBox = document.getElementById("streamBox");

  document.getElementById("matchLabel").textContent = `${a.name}  VS  ${b.name}`;
  streamText.textContent = "";
  streamBox.classList.remove("done");
  document.getElementById("results").classList.remove("on");
  stage.classList.add("shake");
  battle.classList.add("on");
  battle.scrollTop = 0;
  startFightAnim();

  // full fighter objects -> POST endpoints (works identically for roster + custom fighters)
  const payload = JSON.stringify({ a, b });
  const postOpts = { method: "POST", headers: { "Content-Type": "application/json" }, body: payload };

  // 1) get the verdict data first (held back until the stream finishes)
  let result = null;
  try {
    const r = await fetch("/matchups", postOpts);
    result = await r.json();
  } catch(e){
    streamText.textContent = "[failed to reach the arena: " + e + "]";
    return;
  }

  // 2) stream the narration live, token by token
  try {
    const resp = await fetch("/narrate", postOpts);
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    while (true){
      const {done, value} = await reader.read();
      if (done) break;
      streamText.textContent += dec.decode(value, {stream:true});
    }
  } catch(e){
    streamText.textContent += "\n[stream lost: " + e + "]";
  }

  // 3) stream complete -> K.O. scene, reveal the verdict
  streamBox.classList.add("done");
  stage.classList.remove("shake");
  if (result) endFightAnim(result.winner === result.a_name);
  else stopFightAnim();
  showResults(a, b, result);
}

function showResults(a, b, r){
  if (!r) return;
  document.getElementById("winnerBanner").innerHTML =
    `☆ WINNER: ${r.winner} ☆<span class="jp">CONFIDENCE: ${r.confidence}%</span>`;
  document.getElementById("lblA").textContent = `${r.a_name} (A)`;
  document.getElementById("lblB").textContent = `${r.b_name} (B)`;
  document.getElementById("pctA").textContent = r.proba_a + "%";
  document.getElementById("pctB").textContent = r.proba_b + "%";
  document.getElementById("factorList").innerHTML = r.top_factors.map(f => `
    <div class="f">
      <span>${pretty(f.feature.replace(/^a_/, a.name+" ").replace(/^b_/, b.name+" "))}</span>
      <span class="val ${f.value > 0 ? "pos" : "neg"}">${f.value > 0 ? "+" : ""}${f.value} → ${f.favors}</span>
    </div>`).join("");

  const res = document.getElementById("results");
  res.classList.add("on");
  requestAnimationFrame(() => {
    document.getElementById("barA").style.width = r.proba_a + "%";
    document.getElementById("barB").style.width = r.proba_b + "%";
  });
  res.scrollIntoView({behavior:"smooth", block:"start"});
}

init();
